<svg xmlns="http://www.w3.org/2000/svg" class="arb" width="360" height="100" viewBox="0 0 360 100" role="img" aria-label="Arbitr"><title>Arbitr</title><style>.arb .d{stroke-dasharray:1 2;stroke-dashoffset:1}
.arb .ring{animation:arb-draw .9s 0s cubic-bezier(.65,0,.35,1) both}
.arb .dots{transform-origin:50px 50px;animation:arb-spin 1s .25s cubic-bezier(.22,1,.36,1) both}
.arb .a1{animation:arb-draw .7s .4s cubic-bezier(.65,0,.35,1) both}
.arb .a2{animation:arb-draw .3s 1.0s cubic-bezier(.22,1,.36,1) both}
.arb .ln{animation:arb-draw .55s 1.05s cubic-bezier(.33,0,.2,1) both}
.arb .hd{animation:arb-draw .25s 1.55s cubic-bezier(.22,1,.36,1) both}
.arb .wm{animation:arb-word .8s 1.15s cubic-bezier(.22,1,.36,1) both}
@keyframes arb-draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}99.9%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:none;stroke-dashoffset:0;opacity:1}}
@keyframes arb-spin{0%{opacity:0;transform:rotate(-60deg)}100%{opacity:1;transform:rotate(0)}}
@keyframes arb-word{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.arb *{animation:none!important}.arb .d{stroke-dasharray:none!important;stroke-dashoffset:0!important}}</style><circle class="ring d" pathLength="1" transform="rotate(-90 50 50)" cx="50" cy="50" r="43" fill="none" stroke="#14B8A6" stroke-width="4"/>
